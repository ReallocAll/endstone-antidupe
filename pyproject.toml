[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "endstone-antidupe"
version = "0.2.4"
description = "Bundle and high-risk container anti-dupe protection for Endstone"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
authors = [{ name = "ReallocAll" }]
keywords = ["minecraft", "bedrock", "bds", "endstone", "antidupe", "bundle"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[project.urls]
Homepage = "https://github.com/ReallocAll/endstone-antidupe"
Issues = "https://github.com/ReallocAll/endstone-antidupe/issues"

[project.entry-points."endstone"]
antidupe = "endstone_antidupe:AntiDupe"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_antidupe"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
