name: Publish AntiDupe v0.2.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-antidupe-v0.2.3.yml

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  release:
    if: ${{ github.repository == 'ReallocAll/endstone-antidupe' && github.event.head_commit.message == 'release: publish AntiDupe v0.2.3' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Publish verified v0.2.3 wheel
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 912a3ae86ae4f3cbb18e2a3589b2ac8dd1c639f6
          SOURCE_RUN: "38049212916"
        run: |
          set -euo pipefail

          run_info=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}")
          echo "${run_info}" | jq -e --arg sha "${TARGET_SHA}" '.conclusion == "success" and .head_sha == $sha' > /dev/null
          annotation_count=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" --jq '[.check_runs[].output.annotations_count] | add')
          test "${annotation_count}" -eq 0

          if gh release view v0.2.3 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v0.2.3 already exists; refusing to overwrite."
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/release-artifacts"
          gh run download "${SOURCE_RUN}" --repo "${GITHUB_REPOSITORY}" \
            --name endstone-antidupe-py3.15 --dir "${RUNNER_TEMP}/release-artifacts"

          WHEEL="${RUNNER_TEMP}/release-artifacts/endstone_antidupe-0.2.3-py3-none-any.whl"
          test -f "${WHEEL}"
          python3 - "${WHEEL}" <<'PYTHON'
          import hashlib
          import sys
          import zipfile

          path = sys.argv[1]
          with zipfile.ZipFile(path) as wheel:
              files = wheel.namelist()
              metadata = wheel.read(next(n for n in files if n.endswith(".dist-info/METADATA"))).decode()
              entrypoints = wheel.read(next(n for n in files if n.endswith(".dist-info/entry_points.txt"))).decode()
              assert "Name: endstone-antidupe" in metadata
              assert "Version: 0.2.3" in metadata
              assert "[endstone]" in entrypoints
              assert "antidupe = endstone_antidupe:AntiDupe" in entrypoints
              assert "endstone_antidupe/plugin.py" in files
          print("Wheel SHA256:", hashlib.sha256(open(path, "rb").read()).hexdigest())
          PYTHON

          cat > "${RUNNER_TEMP}/release-notes.md" <<'NOTES'
          ## AntiDupe 0.2.3

          Endstone plugin providing targeted mitigation of Minecraft Bedrock Bundle/container item duplication exploits.

          ### Highlights
          - Blocks suspicious Bundle interactions with selected high-risk containers and inventory transactions.
          - Guards inventory requests carried by PlayerAuthInput packets.
          - Correlates container IDs to detect contaminated sessions; supports quarantine and fail-closed hopper rebuilding.
          - Preserves hopper block states, including direction, when rebuilding a contaminated hopper.
          - Optimizes packet listeners so unrelated entity-motion packets take a minimal fast path.
          - Provides optional performance counters via `/antidupe perf` and `/antidupe perf reset`.
          - Fixes the duplicate command-enum registration warning from earlier versions.

          ### Compatibility
          - Plugin supports Python 3.11–3.15; use a matching native Endstone runtime for your Python version.
          - Endstone API 0.11.
          - GPL-3.0-only.

          ### Installation
          1. Download `endstone_antidupe-0.2.3-py3-none-any.whl` below.
          2. Remove older AntiDupe wheels from your server's `plugins/` folder and install this one.
          3. Fully restart BDS.

          **Important:** Hopper rebuilding is intentionally destructive and deletes the container inventory when contamination is detected. Review the `rebuild-on-contamination` setting before production use. This plugin mitigates selected known exploit paths; it does not guarantee protection against all duplication exploits.

          The release wheel was taken from successful CI run [#38049212916](https://github.com/ReallocAll/endstone-antidupe/actions/runs/38049212916), with Python 3.11–3.15 testing and zero annotations.
          NOTES

          gh release create v0.2.3 "${WHEEL}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET_SHA}" \
            --title "AntiDupe v0.2.3" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --latest

          gh release view v0.2.3 --repo "${GITHUB_REPOSITORY}" --json url,tagName,name,isDraft,isPrerelease
