name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false
      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"
      - name: Install project and tools
        run: uv sync --extra dev --python "${{ matrix.python-version }}"
      - name: Static analysis
        run: uv run --no-sync ruff check .
      - name: Tests
        run: uv run --no-sync pytest
      - name: Build wheel
        run: uv build --wheel --out-dir dist
      - name: Install wheel and validate metadata
        run: |
          uv pip install --python .venv/bin/python --no-deps --force-reinstall dist/*.whl
          uv run --no-sync python - <<'PYCODE'
          from importlib.metadata import distribution
          from pathlib import Path
          import tomllib
          import zipfile

          dist = distribution("endstone-antidupe")
          expected_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert dist.version == expected_version, dist.version
          entry_points = [ep for ep in dist.entry_points if ep.group == "endstone"]
          assert len(entry_points) == 1
          assert entry_points[0].name == "antidupe"
          assert entry_points[0].value == "endstone_antidupe:AntiDupe"
          wheel_path, = Path("dist").glob("*.whl")
          with zipfile.ZipFile(wheel_path) as wheel:
              names = wheel.namelist()
              assert "endstone_antidupe/plugin.py" in names
              assert "endstone_antidupe/protocol.py" in names
              assert not any(".egg-info" in item or item.startswith("tests/") for item in names)
          print("Wheel entry point, version, installation and contents verified")
          PYCODE
      - uses: actions/upload-artifact@v7
        with:
          name: endstone-antidupe-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  audit-annotations:
    name: Audit annotations
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      checks: read
      contents: read
    steps:
      - name: Inspect Python check-run annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.name | startswith("Python ")) | .id' > "${RUNNER_TEMP}/antidupe-check-ids"
          test "$(wc -l < "${RUNNER_TEMP}/antidupe-check-ids")" -eq 5

          problems=0
          while IFS= read -r check_id; do
            echo "Check run ${check_id}:"
            annotations=$(gh api "repos/${GITHUB_REPOSITORY}/check-runs/${check_id}/annotations?per_page=100")
            echo "${annotations}" | jq -r '.[] | "  [\(.annotation_level)] \(.title // "untitled"): \(.message) (\(.path):\(.start_line // 0))"'
            count=$(echo "${annotations}" | jq '[.[] | select(.annotation_level == "warning" or .annotation_level == "failure")] | length')
            problems=$((problems + count))
          done < "${RUNNER_TEMP}/antidupe-check-ids"

          echo "Warning/error annotations: ${problems}"
          test "${problems}" -eq 0
